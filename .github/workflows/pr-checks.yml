name: pr-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    # Dormant on purpose. Nothing runs for anyone until a PR carries the
    # `gating-trial` label. Turning it on for the whole repo is deleting this line.
    # Most checks self-skip here: docs has no migrations, no prisma and no deps file.
    if: contains(github.event.pull_request.labels.*.name, 'gating-trial')
    uses: bluejay-ai-dev/bluejay-github-actions/.github/workflows/pr-checks.yml@main
    # Follows main rather than a pinned commit. A pin froze the gate at whatever the
    # shared repo looked like the day this landed. The tradeoff is real: this inherits
    # every secret here, so anyone who can push that repo's main can change what
    # receives them. Acceptable only while the gating-trial label keeps this off
    # ordinary PRs; pin a sha again before that label comes off.
    secrets: inherit