name: pr-checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    # Most checks self-skip here: docs has no migrations, no prisma and no deps file.
    uses: bluejay-ai-dev/bluejay-github-actions/.github/workflows/pr-checks.yml@main
    # Follows main. This inherits every secret here, so anyone who can push that repo's
    # main can change what receives them. Pin a sha if that stops being acceptable.
    secrets: inherit